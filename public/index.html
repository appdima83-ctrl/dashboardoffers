/* ===== Тема «Pane»: стекло, синий акцент ===== */
:root{--bg:#16171b;--tx:#F2F4F8;--tx2:#9aa3b2;--line:rgba(255,255,255,.08)}
body{background:#16171b radial-gradient(900px 500px at 78% -120px,rgba(255,106,26,.10),transparent),radial-gradient(700px 500px at -10% 110%,rgba(255,170,100,.08),transparent);background-attachment:fixed;font-feature-settings:"tnum"}

.main{display:flex;flex-direction:column;gap:22px;min-width:0}
.head h1{font-size:34px;letter-spacing:-.02em;margin:0}.head .sub{margin:4px 0 0;color:var(--tx2);font-size:15px}

/* ===== Стекло (liquid glass) ===== */
body{background:#121316;background-image:radial-gradient(900px 600px at 85% -8%,rgba(255,106,26,.34),transparent 62%),radial-gradient(800px 600px at -8% 100%,rgba(255,170,100,.30),transparent 60%),radial-gradient(700px 500px at 55% 108%,rgba(45,212,191,.16),transparent 62%),radial-gradient(500px 400px at 30% 30%,rgba(244,114,182,.06),transparent 60%);background-attachment:fixed}
.side,.panel,.card{background:linear-gradient(145deg,rgba(255,255,255,.105) 0%,rgba(255,255,255,.04) 42%,rgba(255,255,255,.065) 100%)!important;-webkit-backdrop-filter:blur(26px) saturate(165%);backdrop-filter:blur(26px) saturate(165%);border:1px solid rgba(255,255,255,.06)!important;box-shadow:inset 0 1px 0 rgba(255,255,255,.20),inset 0 -1px 0 rgba(0,0,0,.28),inset 0 0 30px rgba(255,255,255,.03),0 20px 44px rgba(0,0,0,.45)!important}
.panel,.card{position:relative}
.side::after,.panel::after,.card::after{content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;pointer-events:none;background:linear-gradient(155deg,rgba(255,255,255,.42),rgba(255,255,255,.05) 28%,rgba(255,255,255,.02) 68%,rgba(255,255,255,.20));-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude}
.filters input,.filters select,button{background:linear-gradient(180deg,rgba(255,255,255,.10),rgba(255,255,255,.04));border:1px solid rgba(255,255,255,.08);box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 4px 12px rgba(0,0,0,.25)}
.filters input,.filters select{background:rgba(0,0,0,.30);box-shadow:inset 0 2px 5px rgba(0,0,0,.45),inset 0 -1px 0 rgba(255,255,255,.06)}
button.primary{background:linear-gradient(180deg,#FF8A4C,#EA580C)!important;box-shadow:0 8px 22px rgba(234,88,12,.55),inset 0 1px 0 rgba(255,255,255,.45)!important}
button.on,nav#nav a.on{background:linear-gradient(180deg,rgba(255,255,255,.20),rgba(255,255,255,.08))!important;box-shadow:inset 0 1px 0 rgba(255,255,255,.28),0 6px 16px rgba(0,0,0,.35)!important;border-color:rgba(255,255,255,.14)!important}
.card:before{opacity:.9}
.tip{-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);background:rgba(18,19,24,.75)!important}
tfoot td{background:rgba(255,255,255,.05)}
.otr{box-shadow:inset 0 1px 3px rgba(0,0,0,.4)}

html{scroll-behavior:smooth}
body{background:#212225!important;background-image:radial-gradient(1100px 650px at 84% -12%,rgba(120,160,255,.14),transparent 62%),radial-gradient(900px 650px at -6% 108%,rgba(160,140,255,.10),transparent 62%)!important;background-attachment:fixed}

.panel{border-radius:32px}.side{border-radius:34px}.card{border-radius:28px}

nav#nav{position:relative}

.seg button.on,#omodes button.on{background:linear-gradient(180deg,rgba(255,255,255,.26),rgba(255,255,255,.12))!important;color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 4px 12px rgba(0,0,0,.3)!important}
#modes{align-items:center;gap:12px}
.pager .pb{display:flex;gap:6px}

/* ===== Тема «Sentiment»: почти чёрный, плоские карточки, оранжевый акцент ===== */
:root{--bg:#0b0b0c;--tx:#F3F3F2;--tx2:#9a9a98;--line:#242424}

.sync{display:flex;flex-wrap:wrap;gap:2px 8px;align-items:center;color:var(--tx2);font-size:12px;padding:0 10px 12px}.sync i{width:7px;height:7px;border-radius:50%;background:#34D399;box-shadow:0 0 8px #34D399}.sync b{width:100%;padding-left:15px;color:#d8d8d6;font-weight:500}
.sidefoot button{border-radius:10px;background:#151515!important;border:1px solid #242424!important;color:#a3a3a1}

<script>
const $=s=>document.querySelector(s);
const st={rows:null,mode:'traffic',hidden:{},sort:{k:'date',d:-1},ctl:null,cfg:null,error:null,stale:false,cur:'$'};
const fmtI=n=>Math.round(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g,' ');
const fmtM=(n,d=4)=>{const [a,b]=n.toFixed(d).split('.');return a.replace(/\B(?=(\d{3})+(?!\d))/g,' ')+','+b};
const pad=n=>String(n).padStart(2,'0'),ymd=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const dm=s=>s.split('-').reverse().join('.');
const START='2026-09-01'; // начало доступных данных
function quick(q){const t=new Date(),d=new Date(t);let f=t,e=t;
 if(q==='7'){d.setDate(d.getDate()-6);f=d}
 $('#from').value=q==='all'?START:ymd(f);$('#to').value=ymd(e);syncDates();document.querySelectorAll('#quick button').forEach(b=>b.classList.toggle('on',b.dataset.q===q))}
const tot=r=>r.reduce((a,x)=>({hosts:a.hosts+x.hosts,clicks:a.clicks+x.clicks,conversions:a.conversions+x.conversions,amount:a.amount+x.amount}),{hosts:0,clicks:0,conversions:0,amount:0});

async function api(path,p,signal){
 const r=await fetch(path+(p?'?'+p:''),{signal,cache:'no-store',credentials:'same-origin'});
 if(r.status===401){location.href='/login';throw Object.assign(new Error('auth'),{name:'AbortError'})}
 let j;try{j=await r.json()}catch{j={error:'network',message:'Некорректный ответ сервера'}}
 return{r,j}}
let lastLoad=0;
async function load(){lastLoad=Date.now();
 st.ctl&&st.ctl.abort();const ctl=st.ctl=new AbortController();
 const p=new URLSearchParams({from:$('#from').value,to:$('#to').value,offer:$('#offer').value,currency:$('#cur').value||'USD'});if(sts.cty)p.set('country',sts.cty);
 if(location.search.includes('fail'))p.set('fail','network');
 if(!st.rows)renderSkeleton();
 try{
  const {r,j}=await api('/api/stats',p,ctl.signal);
  if(!r.ok)throw Object.assign(new Error(j.message),{code:j.error});
  if(!st.rows||st.rows.length!==j.rows.length)st.page=1;st.rows=j.rows;st.geo=j.geo||null;fillCty((j.geo||[]).map(g=>g.code));st.balance=j.balance;st.offToday=j.offersToday||null;st.today=j.today;st.offers=j.offers||[];st.osrc=j.offersSource;st.error=null;st.stale=false;$('#demo').hidden=!j.demo;
  const t=new Date(j.updatedAt);$('#upd').textContent='Обновлено: '+t.toLocaleTimeString('ru-RU');$('#sync').textContent=t.toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'});$('#upd').className='upd';
 }catch(e){if(e.name==='AbortError')return;st.error=e;if(st.rows){st.stale=true;$('#upd').textContent='Данные не обновлены';$('#upd').className='upd stale'}}
 render();loadAppMap();
}
// Иконки приложений у оффера: откуда пришли клики и хосты (по метке sub1)
const stApps={byOffer:null,busy:null};
async function loadAppMap(){
 const from=$('#from').value,to=$('#to').value,key=from+'|'+to;
 if(stApps.busy===key)return;stApps.busy=key;
 try{
  const [sr,pr]=await Promise.all([fetch('/api/sources?'+new URLSearchParams({from,to}),{credentials:'same-origin'}).then(r=>r.ok?r.json():null),sts.apps?null:fetch('/api/play',{credentials:'same-origin'}).then(r=>r.json()).catch(()=>null)]);
  if(pr&&pr.apps){sts.apps=pr.apps;fillCty(pr.apps.map(appCty))}
  if(sr&&sr.sources){const m={};for(const s of sr.sources){if(!s.sub1)continue;for(const o of s.offers||[])(m[o.id]||=[]).push({s,clicks:o.clicks,hosts:o.hosts})}stApps.byOffer=m}
 }catch{}finally{stApps.busy=null}
 if(st.rows&&!location.hash.slice(1))bars()
}
function appsHtml(o){
 const l=stApps.byOffer&&stApps.byOffer[o.id];if(!l||!l.length)return '';
 const show=[...l].sort((a,b)=>b.clicks-a.clicks||b.hosts-a.hosts).slice(0,4).map(({s,clicks,hosts})=>{
  const pa=s.pkg?(sts.apps||[]).find(p=>p.id===s.pkg):null,nm=(s.title||(pa&&pa.title)||srcName(s.sub1)).replace(/"/g,'&quot;'),ic=pa&&pa.icon,fb=`<span class=&quot;ap pfb&quot;>${nm.charAt(0)}</span>`,
   tip=`${nm}: ${fmtI(clicks)} кл. · ${fmtI(hosts)} хостов`;
  return ic?`<img class="ap" src="${ic}=s64-rw" width="20" height="20" alt="${nm}" title="${tip}" loading="lazy" referrerpolicy="no-referrer" onerror="this.outerHTML='${fb}'">`:`<span class="ap pfb" title="${tip}">${nm.charAt(0)}</span>`}).join('');
 return `<span class="aps">${show}${l.length>4?`<span class="flm" title="${l.slice(4).map(x=>x.s.title||srcName(x.s.sub1)).join(', ')}">+${l.length-4}</span>`:''}</span>`}
function renderSkeleton(){$('#cards').innerHTML='<div class="sk" style="height:130px"></div><div class="sk" style="height:130px"></div>';$('#chartbox').innerHTML='<div class="sk" style="height:100%"></div>';$('#tbl').innerHTML='<div class="sk" style="height:260px"></div>'}
function errBox(){const e=st.error,k=e.code;const t=k==='no_key'?['Не задан API-ключ','Задайте переменную окружения AFFISE_API_KEY на сервере и перезапустите его.']:k==='network'?['Сетевая ошибка','Не удалось получить данные. Это не нулевая статистика.']:['Ошибка доступа к API',e.message];
 return `<div class="msg"><h3>${t[0]}</h3><p>${t[1]}</p><button class="primary" onclick="load()">Повторить</button></div>`}
function render(){
 const b=$('#banner');
 if(!st.rows){b.style.display='none';for(const id of['#cards','#chartbox','#tbl'])$(id).innerHTML=id==='#cards'?'':'';$('#cards').innerHTML='';$('#chartbox').innerHTML=errBox();$('#tbl').innerHTML='';$('#obars').innerHTML='';$('#donut').innerHTML='';return}
 b.style.display=st.stale?'block':'none';if(st.stale)b.textContent='Не удалось обновить данные — показаны предыдущие значения.';
 const T=tot(st.rows);
  const tr=(st.rows||[]).find(r=>r.date===st.today)||{},kg=k=>{const v=+tr[k]||0;return `<span class="kg" title="Прирост за сегодня">↑ +${k==='amount'?fmtM(v,2)+' '+st.cur:fmtI(v)}</span>`};
 $('#cards').innerHTML=`
 <div class="card c"><div class="l">Хосты</div><div class="vr"><div class="v" title="Сумма дневных уникальных посетителей">${fmtI(T.hosts)}</div>${kg('hosts')}</div><div class="s">Уникальные по дням</div></div>
 <div class="card c"><div class="l">Клики</div><div class="vr"><div class="v">${fmtI(T.clicks)}</div>${kg('clicks')}</div><div class="s">Всего за период</div></div>
 <div class="card a"><div class="l">Кол-во офферов</div><div class="vr"><div class="v">${fmtI(T.conversions)}</div>${kg('conversions')}</div><div class="s">Конверсии за период</div></div>
 <div class="card b"><div class="l">Заработано</div><div class="vr"><div class="v" title="Точное значение: ${fmtM(T.amount)} ${st.cur}. Все валюты уже в долларах: Affise пересчитывает выплаты по курсу на день конверсии, как «Итого» в кабинете.">${fmtM(T.amount,2)} ${st.cur}</div>${kg('amount')}</div><div class="s">Финансы → Итого</div></div>`;
 if(!st.rows.length||(T.hosts+T.clicks+T.conversions===0&&false)){}
 chart();geoRender();table(T);bars();balWidget();countUp();
}
const SYM={USD:'$',EUR:'€',ZAR:'R'};
const money=(v,c)=>fmtM(v,2)+' '+(SYM[c]||c);
function balWidget(){
 const el=$('#bw');if(!el)return;const b=st.balance;
 if(!b){el.innerHTML='<p style="color:var(--tx2)">Нет данных о балансе</p>';return}
 const parts=b.parts||[],usd=parts.find(p=>p.code==='USD'),eur=parts.find(p=>p.code==='EUR');
 const td=Object.values(st.offToday||{}).reduce((q,o)=>q+(o.amount||0),0),tot=b.total.USD||0,pc=tot-td>0?td/(tot-td)*100:0,
  gain=`<span class="bgain" title="Прирост за сегодня: +${fmtM(td,2)} $ (${fmtM(pc,2)} % к балансу)">↑ +${fmtM(td,2)} $</span>`;
 el.innerHTML=`<div class="bimg"><img src="cards.webp" alt="" draggable="false">
  <div class="bc1"><b class="bcur">USD</b><div class="bl">Баланс</div><div class="bvr"><div class="bv">${money(usd?usd.amount:0,'USD')}</div>${gain}</div></div>
  <div class="bc2" title="${eur?'Курс Affise: 1 € = '+fmtM(eur.rate,4)+' $ · ≈ '+money(eur.usd,'USD'):'Нет средств в евро'}"><b class="bcur">EUR</b><span class="bam">${money(eur?eur.amount:0,'EUR')}</span></div></div>
  <div class="binfo"><div class="bil">Итого</div><div class="biv" title="Точное значение: ${fmtM(b.total.USD||0)} $">${money(b.total.USD||0,'USD')}</div>
   <div class="bir"><span>Доллары:</span><b>${money(usd?usd.amount:0,'USD')}</b></div>
   <div class="bir" title="${eur?'Курс Affise: 1 € = '+fmtM(eur.rate,4)+' $':''}"><span>Евро:</span><b>${eur?`${money(eur.amount,'EUR')} × ${fmtM(eur.rate,4)} = ${money(eur.usd,'USD')}`:'—'}</b></div></div>`}
function balCard(){
 const b=st.balance;
 if(!b)return '<div class="card d"><div class="l">Баланс</div><div class="v">—</div><div class="s">Нет данных, не удалось получить</div></div>';
 const tot=b.total.USD||0,parts=b.parts||[];
 const nm=c=>{try{const n=new Intl.DisplayNames(['ru'],{type:'currency'}).of(c);return n.charAt(0).toUpperCase()+n.slice(1)}catch{return c}};
 const rows=parts.length>1||(parts[0]&&parts[0].code!=='USD')?parts.map(p=>p.code==='USD'
  ?`<div class="br"><span>${nm('USD').replace('Доллар США','Доллары')}:</span><b>${money(p.amount,'USD')}</b></div>`
  :`<div class="br" title="Курс Affise: 1 ${p.code} = ${fmtM(p.rate,4)} $"><span>${nm(p.code)}:</span><b>${money(p.amount,p.code)} × ${fmtM(p.rate,4)} = ${money(p.usd,'USD')}</b></div>`).join(''):'';
 return `<div class="card d"><div class="l">Баланс</div><div class="v" title="Точное значение: ${fmtM(tot)} $">${money(tot,'USD')}</div>${rows?`<div class="bparts">${rows}</div>`:''}</div>`}

const DPAL=['#FF6A1A','#FFA05C','#E04B00','#FFD0A8','#9A3412','#34D399','#6B7280'];
function donut(L,k,tt){
 const el=$('#donut');if(!el)return;
 if(!L.length){el.innerHTML='<p style="color:var(--tx2)">Нет данных за период</p>';return}
 const cut=L.length<=7?7:6,top=L.slice(0,cut),rest=L.slice(cut).reduce((a,o)=>a+o[k],0);
 const items=top.map(o=>({n:o.title,v:o[k]}));if(rest>0)items.push({n:'Остальные ('+(L.length-cut)+')',v:rest});
 const fv=v=>k==='amount'?fmtM(v,2)+' '+st.cur:fmtI(v),R=70,C=2*Math.PI*R,gap=items.length>1?4:0;let cum=0;

const ALIAS={'united states':'united states of america','türkiye':'turkey','turkiye':'turkey','congo kinshasa':'dem rep congo','congo democratic republic':'dem rep congo','congo brazzaville':'congo','myanmar burma':'myanmar','bosnia herzegovina':'bosnia and herz','eswatini':'eswatini','south sudan':'s sudan','dominican republic':'dominican rep','central african republic':'central african rep','equatorial guinea':'eq guinea','western sahara':'w sahara','solomon islands':'solomon is','north macedonia':'macedonia','côte divoire':'côte divoire','cote divoire':'côte divoire','czech republic':'czechia','russian federation':'russia','korea south':'south korea','korea north':'north korea','palestinian territories':'palestine','falkland islands':'falkland is','french southern territories':'fr s antarctic lands'};
const nk=s=>String(s).toLowerCase().replace(/[’'.,()&\-]/g,' ').replace(/\s+/g,' ').trim();
async function loadWorld(){
 if(WORLD)return WORLD;
 const t=await (await fetch('world-110m.json',{credentials:'same-origin'})).json();
 const {scale:[sx,sy],translate:[tx,ty]}=t.transform;
 const arcs=t.arcs.map(a=>{let x=0,y=0;return a.map(([dx,dy])=>{x+=dx;y+=dy;return [x*sx+tx,y*sy+ty]})});
 const ring=idx=>{const pts=[];idx.forEach((i,k)=>{const a=i<0?[...arcs[~i]].reverse():arcs[i];pts.push(...(k?a.slice(1):a))});return pts};
 // Меркатор, широта обрезана до [-58; 80]
 const W=1000,mer=l=>Math.log(Math.tan(Math.PI/4+Math.min(Math.max(l,-58),80)*Math.PI/360)),y0=mer(80),y1=mer(-58),H=W*(y0-y1)/(2*Math.PI);
 const P=([lo,la])=>[((lo+180)/360*W),((y0-mer(la))/(y0-y1)*H)];
 // развернуть долготу, чтобы контур не «перескакивал» через линию перемены дат
 const unwrap=pts=>{let off=0,prev=pts[0][0];return pts.map(([lo,la],i)=>{let l=lo+off;if(i){while(l-prev>180){off-=360;l-=360}while(l-prev<-180){off+=360;l+=360}}prev=l;return [l,la]})};
 const draw=(pts,sh)=>'M'+pts.map(q=>{const [x,y]=P([q[0]+sh,q[1]]);return x.toFixed(1)+' '+y.toFixed(1)}).join('L')+'Z';
 const path=g=>{const polys=g.type==='Polygon'?[g.arcs]:g.arcs;let d='';polys.forEach(p=>p.forEach(r=>{const raw=ring(r);if(raw.every(q=>q[1]<-58))return;const pts=unwrap(raw),lons=pts.map(q=>q[0]),mn=Math.min(...lons),mx=Math.max(...lons);d+=draw(pts,0);if(mx>180)d+=draw(pts,-360);if(mn<-180)d+=draw(pts,360)}));return d};
 WORLD={W,H,items:t.objects.countries.geometries.map(g=>({name:g.properties.name,key:nk(g.properties.name),d:path(g)})).filter(c=>c.d)};
 return WORLD}
async function drawMap(box,countries){
 if(!box)return;
 let w;try{w=await loadWorld()}catch{box.innerHTML='<p style="color:var(--tx2);padding:12px">Не удалось загрузить карту</p>';return}
 if(!box.isConnected)return;
 const val={};countries.forEach(c=>{const k=nk(c.name);val[ALIAS[k]||k]=(val[ALIAS[k]||k]||0)+c.value});
 const mx=Math.max(1,...Object.values(val)),lg=v=>Math.log(1+v)/Math.log(1+mx);
 box.innerHTML=`<svg viewBox="0 0 ${w.W} ${w.H}" preserveAspectRatio="xMidYMid meet"><g id="mg">${w.items.map(c=>{const v=val[c.key]||0;return `<path class="ct${v?' on':''}" data-n="${c.name}" data-v="${v}" d="${c.d}"${v?` style="fill:rgba(255,106,26,${(.28+.72*lg(v)).toFixed(2)})"`:''}/>`}).join('')}</g></svg>
 <div class="mz"><button data-z="1" aria-label="Приблизить">+</button><button data-z="-1" aria-label="Отдалить">−</button></div><div class="tip" id="mtip"></div>`;
 const svg=box.querySelector('svg'),g=box.querySelector('#mg'),tip=box.querySelector('#mtip');
 let k=1,x=0,y=0;const clamp=()=>{x=Math.min(0,Math.max(w.W*(1-k),x));y=Math.min(0,Math.max(w.H*(1-k),y))};
 const apply=(smooth)=>{clamp();g.style.transition=smooth?'transform .35s cubic-bezier(.2,.8,.2,1)':'none';g.style.transform=`translate(${x}px,${y}px) scale(${k})`};
 g.style.transformOrigin='0 0';
 // масштаб в единицах viewBox → пиксели SVG
 const zoomAt=(f,cx,cy)=>{const nk2=Math.min(8,Math.max(1,k*f)),r=nk2/k;x=cx-(cx-x)*r;y=cy-(cy-y)*r;k=nk2;apply(true)};
 const vb=e=>{const r=svg.getBoundingClientRect(),s=Math.min(r.width/w.W,r.height/w.H),ox=(r.width-w.W*s)/2,oy=(r.height-w.H*s)/2;return [(e.clientX-r.left-ox)/s,(e.clientY-r.top-oy)/s]};
 box.querySelectorAll('.mz button').forEach(b=>b.onclick=()=>zoomAt(+b.dataset.z>0?1.6:1/1.6,w.W/2,w.H/2));
 box.addEventListener('wheel',e=>{e.preventDefault();const [cx,cy]=vb(e);zoomAt(e.deltaY<0?1.25:.8,cx,cy)},{passive:false});
 let drag=null;
 svg.onpointerdown=e=>{if(k<=1)return;drag={px:e.clientX,py:e.clientY,x,y};svg.setPointerCapture(e.pointerId)};
 svg.onpointermove=e=>{if(drag){const r=svg.getBoundingClientRect(),s=w.W/r.width;x=drag.x+(e.clientX-drag.px)*s;y=drag.y+(e.clientY-drag.py)*s;apply(false);tip.style.display='none';return}
  const p=e.target.closest&&e.target.closest('.ct');if(!p){tip.style.display='none';return}
  const v=+p.dataset.v,rc=box.getBoundingClientRect();tip.innerHTML=`<b>${p.dataset.n}</b><br>${v?`Активных пользователей: <b>${fmtI(v)}</b>`:'Нет данных'}`;tip.style.display='block';
  tip.style.left=Math.min(e.clientX-rc.left+12,rc.width-tip.offsetWidth-4)+'px';tip.style.top=Math.max(4,e.clientY-rc.top-tip.offsetHeight-10)+'px'};
 svg.onpointerup=svg.onpointercancel=()=>{drag=null};svg.onpointerleave=()=>{tip.style.display='none'};
}
