services:
  - type: web
    name: profitcash-stats
    runtime: node
    plan: free
    buildCommand: "echo no build"
    startCommand: node server.js
    healthCheckPath: /login
    envVars:
      - key: DASH_PASSWORD
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: AFFISE_API_KEY
        sync: false
      # Ключ сервисного аккаунта Google одной строкой: всё содержимое JSON-файла
      - key: GA_SERVICE_ACCOUNT_JSON
        sync: false
